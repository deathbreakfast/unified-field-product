          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (primary packages, deny broken intra-doc links)
        working-directory: ${{ env.PRODUCT_WD }}
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: |
          cargo doc -p uf-product-macros -p uf-codegen --no-deps
          cargo doc -p uf-search-core --features ssr --no-deps
          cargo doc -p uf-product -p uf-integrations --features ssr --no-deps

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      # leptos-lints@v0.1.2 pins nightly-2025-05-14; lint hydrate UI crates with
      # `--no-deps` where Leptos API lints apply.
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (leptos-lints)
        working-directory: ${{ env.PRODUCT_WD }}
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: |
          cargo dylint --all -p uf-apps --no-deps -- --features hydrate
          cargo dylint --all -p uf-welcome --no-deps -- --features hydrate
          cargo dylint --all -p uf-integrations --no-deps -- --features hydrate
