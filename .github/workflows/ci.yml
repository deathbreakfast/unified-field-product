# PR / merge gate aligned with docs/VERIFICATION.md Layer 1, Layer 2 (Playwright),
# and documentation gates.
# Sibling checkouts assume the Unified Field operator layout; CI checks this repo
# out under that path and shallow-clones L0/L1/L2/L3 siblings.
#
# Pull requests: `pull_request` runs for branches on this repo.
# Prefer same-repo PRs on unified-field-dev so Actions secrets for sibling clones work.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-uf-product
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"
  UF_ROOT: unified-field
  PRODUCT_WD: unified-field/L2-product-platform/unified-field-product

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check (Layer 1 packages)
        working-directory: ${{ env.PRODUCT_WD }}
        run: >
          cargo fmt
          -p uf-product-macros -p uf-codegen -p uf-apps -p uf-search-core
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      - name: cargo clippy (macros + codegen + search-core)
        working-directory: ${{ env.PRODUCT_WD }}
        run: >
          cargo clippy
          -p uf-product-macros -p uf-codegen -p uf-search-core
          --all-targets -- -D warnings
      - name: cargo clippy (uf-apps, ssr)
        working-directory: ${{ env.PRODUCT_WD }}
        run: cargo clippy -p uf-apps --features ssr --all-targets -- -D warnings

  # Lighter packages share one runner (same Layer 1 commands as VERIFICATION.md).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (macros + codegen)
        working-directory: ${{ env.PRODUCT_WD }}
        run: cargo test -p uf-product-macros -p uf-codegen
      - name: cargo test (uf-search-core, ssr)
        working-directory: ${{ env.PRODUCT_WD }}
        run: cargo test -p uf-search-core --features ssr
      - name: cargo test (uf-apps, ssr)
        working-directory: ${{ env.PRODUCT_WD }}
        run: cargo test -p uf-apps --features ssr

  # Fat ssr test bins each get a fresh runner; mold + one retry for linker flakes
  # (ld bus error / OOM on ubuntu-latest when linking uf-product / uf-welcome).
  test-heavy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [uf-product, uf-welcome]
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: cargo test (${{ matrix.package }}, ssr)
        working-directory: ${{ env.PRODUCT_WD }}
        env:
          RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}"
          for attempt in 1 2; do
            if cargo test -p "${pkg}" --features ssr; then
              exit 0
            fi
            if [ "${attempt}" -eq 1 ]; then
              echo "cargo test -p ${pkg} failed (possible linker flake); retrying once..."
              sleep 5
            fi
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-uf-product
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo leptos end-to-end
        working-directory: ${{ env.PRODUCT_WD }}
        env:
          CI: true
        run: cargo leptos end-to-end --project uf-product-ui-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-uf-product-${{ github.run_id }}
          path: |
            ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end/playwright-report/
            ${{ env.PRODUCT_WD }}/uf-product-ui-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
