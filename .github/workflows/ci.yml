# PR / merge gate aligned with docs/VERIFICATION.md Layer 1, Layer 2 (Playwright),
# and documentation gates.
# Standalone checkout: UF deps resolve via git branch = main on unified-field-dev.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-uf-product
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check (Layer 1 packages)
        run: >
          cargo fmt
          -p uf-product-macros -p uf-codegen -p uf-apps -p uf-search-core
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      - name: cargo clippy (macros + codegen + search-core)
        run: >
          cargo clippy
          -p uf-product-macros -p uf-codegen -p uf-search-core
          --all-targets -- -D warnings
      - name: cargo clippy (uf-apps, ssr)
        run: cargo clippy -p uf-apps --features ssr --all-targets -- -D warnings

  # Lighter packages share one runner (same Layer 1 commands as VERIFICATION.md).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (macros + codegen)
        run: cargo test -p uf-product-macros -p uf-codegen
      - name: cargo test (uf-search-core, ssr)
        run: cargo test -p uf-search-core --features ssr
      - name: cargo test (uf-apps, ssr)
        run: cargo test -p uf-apps --features ssr

  # Fat ssr test bins each get a fresh runner, with one retry for linker flakes
  # (bus error / OOM on ubuntu-latest when linking uf-product / uf-welcome).
  test-heavy-uf-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (uf-product, ssr)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if cargo test -p uf-product --features ssr; then
              exit 0
            fi
            if [ "${attempt}" -eq 1 ]; then
              echo "cargo test -p uf-product failed (possible linker flake); retrying once..."
              sleep 5
            fi
          done
          exit 1

  test-heavy-uf-welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (uf-welcome, ssr + admin-permissions)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if cargo test -p uf-welcome --features ssr,admin-permissions; then
              exit 0
            fi
            if [ "${attempt}" -eq 1 ]; then
              echo "cargo test -p uf-welcome failed (possible linker flake); retrying once..."
              sleep 5
            fi
          done
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: uf-product-ui-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: uf-product-ui-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: uf-product-ui-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-uf-product
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: uf-product-ui-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: uf-product-ui-e2e/end2end
        run: npx playwright install-deps chromium
      # `cargo leptos end-to-end` exits 0 when the host fails to compile, so build first.
      - name: cargo leptos build
        env:
          CI: true
        run: cargo leptos build --project uf-product-ui-e2e
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --project uf-product-ui-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-uf-product-${{ github.run_id }}
          path: |
            uf-product-ui-e2e/end2end/playwright-report/
            uf-product-ui-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (primary packages, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: |
          cargo doc -p uf-product-macros -p uf-codegen --no-deps
          cargo doc -p uf-search-core --features ssr --no-deps
          cargo doc -p uf-product -p uf-integrations --features ssr --no-deps
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      # leptos-lints@v0.1.2 pins nightly-2025-05-14; lint hydrate UI crates with
      # `--no-deps` where Leptos API lints apply.
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (leptos-lints)
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: |
          cargo dylint --all -p uf-apps --no-deps -- --features hydrate
          cargo dylint --all -p uf-welcome --no-deps -- --features hydrate
          cargo dylint --all -p uf-integrations --no-deps -- --features hydrate
